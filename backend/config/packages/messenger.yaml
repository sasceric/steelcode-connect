framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 30000
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        routing:
            'App\Message\ImportShopwareProducts': async
            'App\Message\ImportShopwareSales': async
            'App\Message\QueueShopwareSalesSync': async
            'App\Message\SyncShopwareSalesConnection': async

